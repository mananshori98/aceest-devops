apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: blue
        version: v1
    spec:
      containers:
        - name: app
          image: mananshori98/aceest-fitness-devops:v1.0.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      slot: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: green
        version: v2
    spec:
      containers:
        - name: app
          image: mananshori98/aceest-fitness-devops:v2.0.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
  type: NodePort
