apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
        version: v1
    spec:
      containers:
        - name: app
          image: mananshori98/aceest-fitness-devops:v1.0.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
        version: v2
    spec:
      containers:
        - name: app
          image: mananshori98/aceest-fitness-devops:v2.0.0
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  selector:
    app: aceest-canary
  ports:
    - port: 80
      targetPort: 5000
  type: NodePort
