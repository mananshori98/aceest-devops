name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies from requirements.txt
        run: pip install -r requirements.txt

      # Lint tool is pinned inline so it never alters requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8==7.2.0
          flake8 app.py tests/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-app .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-app pytest --tb=short

  push:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag and push image
        run: |
          docker build -t aceest-app .
          docker tag aceest-app ${{ secrets.DOCKERHUB_USERNAME }}/aceest-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aceest-app:latest
