name: ACEest Assignment 2 CI

on:
  push:
    branches: [main, feature/assignment-2-cicd]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate syntax
        run: python -m py_compile app.py

      - name: Run tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml

      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Run tests inside Docker image
        run: docker run --rm aceest-fitness:${{ github.sha }} python -m pytest -q
